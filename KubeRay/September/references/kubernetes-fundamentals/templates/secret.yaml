# secret.yaml — 存放敏感資料（對應 Lesson 6）
# ⚠️ Secret 預設「不是加密」，只是 base64 編碼；有權限者一行就能還原明文。
#    真機密別明文 commit 進 git；生產環境要另外做 encryption at rest / 外部 KMS / RBAC。
#
# 形式 A：stringData（收明文，人類友善，Kubernetes 自動幫你 base64）—— 建議手寫時用這個
apiVersion: v1
kind: Secret
metadata:
  name: <SECRET_NAME>       # 與使用它的 Pod 必須同 namespace
  namespace: <NS>
type: Opaque               # 一般用途；也有 kubernetes.io/basic-auth、kubernetes.io/ssh-auth 等
stringData:
  <KEY>: "<PLAINTEXT_VALUE>"    # 直接寫明文，套用後 K8s 會轉成 base64 存進 data
---
# 形式 B：data（值需自己先 base64 編碼）—— 對照用
#   產生方式：echo -n '<PLAINTEXT_VALUE>' | base64
apiVersion: v1
kind: Secret
metadata:
  name: <SECRET_NAME>-b64
  namespace: <NS>
type: Opaque
data:
  <KEY>: <BASE64_VALUE>          # 例：alta3 → YWx0YTM=
# 命令式對照：kubectl create secret generic <SECRET_NAME> --from-literal=<KEY>=<VALUE>
# 檢視（會顯示明文，證明未加密）：
#   kubectl get secret <SECRET_NAME> -o jsonpath='{.data.<KEY>}' | base64 -d
