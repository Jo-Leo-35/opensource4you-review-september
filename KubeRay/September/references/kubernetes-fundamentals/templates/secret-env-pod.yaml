# secret-env-pod.yaml — 用 secretKeyRef 把 Secret 注入容器環境變數（對應 Lesson 6）
# 資料流：Secret 的某個 key → 容器內的某個環境變數。
# 要換成 ConfigMap，只需把 secretKeyRef 改成 configMapKeyRef（凸顯兩者可互換）。
apiVersion: v1
kind: Pod
metadata:
  name: <APP_NAME>
  namespace: <NS>
spec:
  containers:
    - name: <APP_NAME>
      image: <IMAGE>:<TAG>
      env:
        - name: <ENV_VAR_NAME>          # 容器內看到的環境變數名，例：MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: <SECRET_NAME>       # 指向 Secret 名稱
              key: <KEY>               # 指向 Secret 裡的哪個 key
        # 反例（請勿這樣做）：直接寫明文，會隨 git/CI 外洩
        # - name: <ENV_VAR_NAME>
        #   value: "<PLAINTEXT>"       # ❌
# 驗證注入成功（同時證明未加密）：
#   kubectl exec <APP_NAME> -- printenv <ENV_VAR_NAME>
